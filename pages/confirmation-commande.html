<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warhammer Store - Achat Effectué</title>
    <link href="/src/style.css" rel="stylesheet" />
</head>
<body class="bg-black font-family-primary">

    <header class="bg-black border-b border-gray-800 text-white">
        <section class="max-w-screen-xl mx-auto px-8">
            <nav class="h-16 flex items-center justify-between">
                <a href="../index.html" class="h-10 w-auto">
                    <img src="/assets/wlogo.png" alt="Warhammer Logo" class="h-full w-full object-contain" />
                </a>
                <a href="../index.html" class="text-white font-bold tracking-wider uppercase hover:text-warhammer-yellow transition-colors text-sm">
                    Tous les Produits
                </a>
                <form class="bg-gray-800 rounded-full px-4 py-2 w-full max-w-md flex items-center">
                    <input type="search" placeholder="RECHERCHER DANS LE MAGASIN..." class="bg-transparent text-gray-400 placeholder-gray-500 text-sm tracking-wide uppercase flex-1 outline-none"/>
                    <button type="submit" class="w-5 h-5 flex-shrink-0 text-gray-400">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </button>
                </form>
                <section class="flex items-center gap-6">
                    <a href="connexion.html" class="w-6 h-6 hover:text-warhammer-yellow transition-colors">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </a>
                    <a href="panier-vide.html" class="w-6 h-6 text-white hover:text-warhammer-yellow transition-colors">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    </a>
                </section>
            </nav>
        </section>
    </header>

    <main class="bg-white text-black py-12">
        <section class="max-w-screen-xl mx-auto px-8">
            <a href="../index.html" class="inline-flex items-center gap-2 text-sm font-normal tracking-widest text-gray-500 uppercase mb-8 hover:text-black transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Retour aux produits
            </a>

            <h1 class="text-2xl font-medium tracking-wider uppercase mt-4 mb-8">Achat effectué</h1>

            <section class="border border-gray-200 rounded-lg p-10 max-w-4xl mx-auto mt-12">
                <section class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                    
                    <section class="flex flex-col gap-4">
                        <figure class="flex items-center gap-3">
                            <svg class="h-10 w-10 text-green-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                            </svg>
                            <h2 class="text-2xl font-medium tracking-wider uppercase">Merci de votre confiance</h2>
                        </figure>
                        
                        <p class="text-gray-600 text-sm">Achat effectué avec succès.</p>
                        <p class="text-gray-600 text-sm">Vous avez reçu un mail de confirmation.</p>
                        <p class="text-gray-600 text-sm">Vous avez reçu votre facture par mail.</p>
                        <p class="text-gray-600 text-sm">Vous pouvez suivre votre commande.</p>
                    </section>
                    
                    <nav class="flex flex-col gap-4">
                        <a href="../index.html" class="block text-center border-2 border-black text-black font-bold text-base tracking-wider uppercase py-3.5 rounded-full hover:bg-gray-100 transition-colors">
                            Continuer mes achats
                        </a>
                        <a href="#" class="block text-center bg-warhammer-yellow text-warhammer-black font-bold text-base tracking-wider uppercase py-4 rounded-full hover:bg-yellow-400 transition-colors">
                            Suivi
                        </a>
                    </nav>

                </section>
            </section>
        </section>
    </main>

    <footer class="bg-black border-t border-warhammer-header-border mt-16">
       </footer>

</body>
</html>
